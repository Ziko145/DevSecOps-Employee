name: Java CI with Maven

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupération du code source depuis GitHub
      - name: Vérification du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configuration de Java 17 (Pour votre application et vos tests)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Configuration de Java 21 (Requis par SonarQube)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. Build, test et analyse SonarQube
      - name: Build & Test
        run: mvn clean verify sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}
